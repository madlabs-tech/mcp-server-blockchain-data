<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Aggregator Dashboard</title>
<link rel="stylesheet" href="/dashboard/app.css">
<script src="/dashboard/app.js" defer></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true">◆</span>
    <span>evm-mcp-server</span>
    <span id="mode" class="badge" hidden></span>
  </div>
  <nav aria-label="Dashboard sections">
    <ul id="nav">
      <li><a href="#overview">Overview</a></li>
      <li><a href="#quota">Quota</a></li>
      <li><a href="#vendors">Vendors</a></li>
      <li><a href="#routing">Routing</a></li>
      <li><a href="#tools">Tools</a></li>
      <li><a href="#chains">Chains</a></li>
      <li><a href="#clients">Clients</a></li>
    </ul>
  </nav>
  <div class="top-actions">
    <button type="button" id="theme" class="ghost" aria-label="Toggle dark mode">◐</button>
    <button type="button" id="reload" class="ghost" hidden>Reload config</button>
    <button type="button" id="logout" class="ghost" hidden>Sign out</button>
  </div>
</header>

<div id="status" class="status" role="status" aria-live="polite"></div>

<main id="main" tabindex="-1">
  <section id="login" class="panel narrow" hidden>
    <h1>Sign in</h1>
    <p>Paste the admin token. It is in <code>config/admin_token</code> (printed once on first start).</p>
    <form id="login-form">
      <label for="token">Admin token</label>
      <input id="token" name="token" type="password" autocomplete="off" required spellcheck="false">
      <button type="submit">Sign in</button>
    </form>
    <p class="muted">The token is kept in this tab only (session storage).</p>
  </section>
  <div id="view"></div>
</main>
<noscript><p class="panel">This dashboard needs JavaScript (no external resources are loaded).</p></noscript>
</body>
</html>
