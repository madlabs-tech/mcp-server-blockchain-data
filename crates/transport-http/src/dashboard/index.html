<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0a0f">
<title>onchain-data-mcp</title>
<link rel="preload" href="/dashboard/fonts/jetbrains-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/dashboard/fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/dashboard/app.css">
<script src="/dashboard/app.js" defer></script>
</head>
<body>
<section id="login" class="login" aria-labelledby="login-title" hidden>
  <div class="cut hue term login-box">
    <div class="term-bar"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span><span>auth@onchain-data-mcp:~</span></div>
    <div class="term-body">
      <h1 id="login-title" class="glitch" data-text="ONCHAIN-DATA-MCP">ONCHAIN-DATA-MCP</h1>
      <p class="kicker">// operator console · restricted access</p>
      <form id="login-form" class="login-form">
        <label for="token" class="prompt">&gt; ENTER DASHBOARD PASSWORD<span class="cursor" aria-hidden="true"></span></label>
        <div class="cut in"><span class="in-pfx" aria-hidden="true">&gt;</span><input id="token" name="token" type="password" autocomplete="current-password" required spellcheck="false" aria-describedby="login-err login-hint"></div>
        <p id="login-err" class="field-err" role="alert"></p>
        <button type="submit" class="cut btn solid">Access</button>
      </form>
      <p id="login-hint" class="hint">Run <code>onchain-data-mcp password</code> in a terminal to see it.</p>
      <p class="hint dim">Kept in this browser tab only (session storage).</p>
    </div>
  </div>
</section>

<div id="app" class="app" hidden>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="logo glitch" data-text="ONCHAIN-DATA-MCP" href="#overview" aria-label="onchain-data-mcp overview">ONCHAIN-DATA-MCP</a>
    <span id="mode" class="tag"></span>
    <div class="top-actions">
      <button type="button" id="reload" class="cut btn ghost small" title="Re-read config files from disk"></button>
      <button type="button" id="logout" class="cut btn ghost small"></button>
      <button type="button" id="menu" class="cut btn ghost icon menu-btn" aria-expanded="false" aria-controls="side" aria-label="Menu"></button>
    </div>
  </header>
  <nav id="side" class="side" aria-label="Dashboard sections">
    <ul id="nav"></ul>
    <p class="side-foot">sys://onchain-data-mcp<span class="cursor" aria-hidden="true"></span></p>
  </nav>
  <main id="main" tabindex="-1"><div id="view"></div></main>
</div>

<div id="status" class="toasts" role="status" aria-live="polite"></div>
<noscript><p class="noscript">This dashboard needs JavaScript (it loads no external resources).</p></noscript>
</body>
</html>
