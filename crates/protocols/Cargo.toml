[package]
name = "bdm-protocols"
description = "Contract and program readers (ERC-20, Multicall3, issuer controls, Chainlink, SPL...) over chain ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
bdm-domain = { workspace = true }
bdm-ports = { workspace = true }
bdm-config = { workspace = true }
bdm-routing = { workspace = true }
alloy-primitives = { workspace = true }
alloy-sol-types = { workspace = true }
async-trait = { workspace = true }
bs58 = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
# solana (T1.S1): PDA off-curve check + wire decoding
base64 = "0.22"
curve25519-dalek = { version = "4", default-features = false }

[dev-dependencies]
bdm-testkit = { workspace = true }
bdm-adapters = { workspace = true }   # evm: live fixture recording (#[ignore] tests) only
tokio = { workspace = true }
