[package]
name = "ems-server"
description = "Composition root and binary for the blockchain data aggregator (MCP + REST)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "evm-mcp-server"   # kept for compatibility with existing MCP client configs
path = "src/main.rs"

[dependencies]
ems-adapters = { workspace = true }
ems-app = { workspace = true }
ems-config = { workspace = true }
ems-domain = { workspace = true }
ems-ports = { workspace = true }
ems-protocols = { workspace = true }
ems-routing = { workspace = true }
ems-transport-http = { workspace = true }
ems-transport-mcp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tempfile = "3"
