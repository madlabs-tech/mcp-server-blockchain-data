[package]
name = "onchain-data-mcp"
description = "MCP + REST server for blockchain data (EVM + Solana) with vendor routing and free-tier quotas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "onchain-data-mcp"
path = "src/main.rs"

[dependencies]
bdm-adapters = { workspace = true }
bdm-app = { workspace = true }
bdm-config = { workspace = true }
bdm-domain = { workspace = true }
bdm-ports = { workspace = true }
bdm-protocols = { workspace = true }
bdm-routing = { workspace = true }
bdm-store = { workspace = true }
bdm-transport-http = { workspace = true }
bdm-transport-mcp = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
futures = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
chrono = { workspace = true }
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
serde_json = { workspace = true }
tempfile = "3"
reqwest = { workspace = true }

[lints]
workspace = true
