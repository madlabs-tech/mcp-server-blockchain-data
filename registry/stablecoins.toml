# Canonical stablecoin registry. One row per (coin, chain). Owner: payments-stablecoin (T1.P1).
#
# Rules (enforced by `StablecoinRegistry::parse`, i.e. by `cargo test`):
# - Addresses come ONLY from issuer docs (`source_url`), copied verbatim; EVM addresses EIP-55.
# - `verified_at` is when the row was checked. Leave a coin/chain out rather than guess.
# - Decimals, freeze/pause methods and Solana program/extensions were additionally confirmed
#   on-chain via public RPC on 2026-09-23 (e.g. Avalanche USDT uses `isBlocked` and has no
#   `paused()`; USDT0 has no `paused()`).
#
# Skipped as unverified (no issuer listing): USDC/EURC on BSC and Robinhood Chain (Circle lists
# neither; BSC is "USYC only" for CCTP), Binance-Peg USDC/USDT on BSC, USDT/USDT0 on Base, BSC and
# Robinhood, PYUSD/USDG/RLUSD on chains their issuers don't list, DAI/USDS on L2s other than
# USDS on Base. Chainlink/Pyth feed ids and MiCA status: not verified from issuer sources yet.

