# Tokenized-stock issuers (data, not code). Owner: market-trading (T1.M4).
#
# RULES: only addresses copied from the issuer's or the oracle's official docs, each with a
# `source_url` and `verified_at`. Nothing invented. `verified = false` issuers are placeholders:
# they list no tokens until someone checks the issuer docs. A token with a known ticker but an
# address that is not listed here is reported as NOT on the official list (possible lookalike).
# Parsed and validated by `bdm_protocols::rwa::RwaRegistry` (EIP-55 checksums enforced).

