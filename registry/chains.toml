# Built-in chain registry (data, not code). Override or extend in config.toml:
#   [chain_overrides."eip155:56"] enabled = false
#   [[extra_chains]] ... same schema as below
# Public RPCs verified with eth_chainId / getGenesisHash on 2026-09-23. Public endpoints are
# rate-limited and meant as the last fallback, not production primaries.
# `name` / `native.symbol` for the 5 legacy chains must stay unchanged (legacy tool output).

[[chain]]
id = "eip155:1"
name = "Ethereum"
aliases = ["ethereum", "eth", "mainnet"]
family = "evm"
native = { symbol = "ETH", decimals = 18, slip44 = 60 }
