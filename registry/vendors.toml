"eip155:8453"   = "https://{endpoint_name}.base-mainnet.quiknode.pro/{token_id}/"
"eip155:42161"  = "https://{endpoint_name}.arbitrum-mainnet.quiknode.pro/{token_id}/"
"eip155:10"     = "https://{endpoint_name}.optimism.quiknode.pro/{token_id}/"
"eip155:137"    = "https://{endpoint_name}.matic.quiknode.pro/{token_id}/"
"eip155:43114"  = "https://{endpoint_name}.avalanche-mainnet.quiknode.pro/{token_id}/ext/bc/C/rpc"
"eip155:56"     = "https://{endpoint_name}.bsc.quiknode.pro/{token_id}/"
