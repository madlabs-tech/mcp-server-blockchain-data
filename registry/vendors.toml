[vendor.alchemy]
display_name = "Alchemy"
requires_key = true
keys = { api_key = "ALCHEMY_API_KEY" }
signup_url = "https://dashboard.alchemy.com/signup"
free_tier_verified = true
tier = 2
unit = "credits"
reset = "calendar_month"
limit = { monthly = 30_000_000 }               # Free: 30M CU/mo, 25 req/s; # verified 2026-09-25 https://www.alchemy.com/pricing
default_cost = 20
costs = { eth_blockNumber = 10, eth_chainId = 0, eth_getBalance = 20, eth_call = 26, eth_getLogs = 60, eth_getTransactionReceipt = 20, eth_getTransactionByHash = 20, eth_getBlockByNumber = 20, eth_sendRawTransaction = 40, eth_feeHistory = 10, eth_simulateV1 = 40, debug_traceCall = 40, alchemy_getAssetTransfers = 120, alchemy_getTokenBalances = 20, alchemy_getTokenMetadata = 10 }   # # verified 2026-09-25 https://www.alchemy.com/docs/reference/compute-unit-costs
