# Built-in vendor registry: free-tier limits, key env names, URL templates, cost tables and the
# built-in routing order (lowest precedence; config.toml and env override everything here).
#
# Limits are the vendor's FREE tier from plan/research (2026-09-23). `free_tier_verified = false`
# vendors ship disabled until someone confirms the free tier. Costs are per request in the vendor's
# unit and are ESTIMATES (local metering is labeled "estimated" in the dashboard). Adapter owners
# refine cost tables in Phase 1. URL placeholders: {api_key} {endpoint_name} {token_id}.
#
# Pseudo-vendors: "public" = keyless public RPCs from chains.toml; "rpc" = generic implementations
# over the routed chain RPC (Multicall3 balances, getLogs scans, feeHistory, on-chain oracles).

# ----------------------------------------------------------------------------- built-in orders
[default_order]
evm_rpc          = ["alchemy", "quicknode", "public"]
solana_rpc       = ["helius", "quicknode", "public"]
token_balances   = ["alchemy", "moralis", "rpc"]
transfer_history = ["alchemy", "moralis", "rpc"]
fee_estimate     = ["rpc"]
simulate         = ["rpc"]
broadcast        = ["alchemy", "quicknode", "public"]
private_relay    = ["flashbots", "mev_blocker"]
price            = ["coingecko", "defillama", "geckoterminal", "dexscreener"]
price_history    = ["coingecko", "defillama", "pyth"]
token_metadata   = ["rpc", "coingecko"]
token_risk       = ["goplus", "honeypot_is", "rugcheck"]
swap_quote       = ["oneinch", "velora", "cow"]
sanctions        = ["chainalysis_oracle", "trm"]
fx               = ["frankfurter", "openexchangerates"]

[default_order_chain."solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"]
token_balances   = ["helius", "rpc"]
transfer_history = ["rpc"]                              # Helius getTransfersByAddress is paid-only
fee_estimate     = ["helius", "quicknode", "rpc"]
broadcast        = ["helius", "quicknode", "public"]
private_relay    = ["jito", "helius_sender"]
price            = ["jupiter", "birdeye", "defillama", "coingecko"]
token_metadata   = ["rpc", "helius", "jupiter"]
token_risk       = ["rugcheck", "goplus"]
swap_quote       = ["jupiter"]
sanctions        = ["trm"]                              # Chainalysis oracle is EVM-only

# ----------------------------------------------------------------------------- pseudo-vendors
[vendor.public]
display_name = "Public RPC (keyless)"
requires_key = false
free_tier_verified = true
unit = "requests"
reset = "rolling"
limit = { rps = 5 }                 # conservative; Solana public = 100 req/10 s per IP
note = "Rate-limited, not for production. Last-resort fallback."

[vendor.rpc]
display_name = "On-chain via routed RPC"
requires_key = false
free_tier_verified = true
unit = "requests"
reset = "rolling"
note = "Generic implementations; usage is metered on the underlying RPC vendor."

# ----------------------------------------------------------------------------- chain data
[vendor.alchemy]
display_name = "Alchemy"
requires_key = true
keys = { api_key = "ALCHEMY_API_KEY" }
signup_url = "https://dashboard.alchemy.com/signup"
free_tier_verified = true
unit = "credits"
reset = "calendar_month"
limit = { monthly = 30_000_000 }
default_cost = 20
costs = { eth_blockNumber = 10, eth_chainId = 0, eth_getBalance = 20, eth_call = 26, eth_getLogs = 75, eth_getTransactionReceipt = 20, eth_sendRawTransaction = 250, eth_feeHistory = 10, eth_simulateV1 = 100, alchemy_getAssetTransfers = 150, alchemy_getTokenBalances = 26 }   # ⚠ estimates
rpc_features = { get_logs_max_range = 10, simulate_v1 = true }
[vendor.alchemy.rpc_urls]
"eip155:1"      = "https://eth-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:8453"   = "https://base-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:42161"  = "https://arb-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:10"     = "https://opt-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:137"    = "https://polygon-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:43114"  = "https://avax-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:56"     = "https://bnb-mainnet.g.alchemy.com/v2/{api_key}"
"eip155:4663"   = "https://robinhood-mainnet.g.alchemy.com/v2/{api_key}"
"solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp" = "https://solana-mainnet.g.alchemy.com/v2/{api_key}"

[vendor.quicknode]
display_name = "QuickNode"
requires_key = true
keys = { endpoint_name = "QN_ENDPOINT_NAME", token_id = "QN_TOKEN_ID" }
signup_url = "https://dashboard.quicknode.com/signup"
