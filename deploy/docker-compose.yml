# Hosted mode: evm-mcp-server behind Caddy (automatic TLS). Only Caddy's 80/443 are public.
# Usage:  cp .env.example .env  (set EMS__SERVER__MODE=hosted + vendor keys)
#         docker compose -f deploy/docker-compose.yml run --rm evm-mcp-server clients create alice
#         docker compose -f deploy/docker-compose.yml up -d
services:
  evm-mcp-server:
    build: ..
    image: evm-mcp-server:latest
    container_name: ems
    restart: unless-stopped
    env_file: ../.env
    environment:
      EMS__SERVER__MODE: hosted
      EMS__SERVER__PUBLIC_BIND: 0.0.0.0:8787    # reached only by Caddy on the compose network
      EMS__SERVER__ADMIN_BIND: 0.0.0.0:8788     # published to the host's loopback only (below)
      EMS__SERVER__DATA_DIR: /data
    volumes:
      - ems-data:/data
      - ems-config:/config
    ports:
      - "127.0.0.1:8788:8788"                   # dashboard + admin API: ssh -L 8788:127.0.0.1:8788 you@vps
    expose:
      - "8787"

  caddy:
    image: caddy:2
    container_name: ems-caddy
    restart: unless-stopped
    depends_on:
      - evm-mcp-server
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ems-data:
  ems-config:
  caddy-data:
  caddy-config:
