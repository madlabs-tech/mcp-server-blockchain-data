# Hosted mode: blockchain-data-mcp behind Caddy (automatic TLS). Only Caddy's 80/443 are public.
# Usage:  cp .env.example .env  (set BDM__SERVER__MODE=hosted + vendor keys)
#         docker compose -f deploy/docker-compose.yml run --rm blockchain-data-mcp clients create alice
#         docker compose -f deploy/docker-compose.yml up -d
services:
  blockchain-data-mcp:
    build: ..
    image: blockchain-data-mcp:latest
    container_name: ems
    restart: unless-stopped
    env_file: ../.env
    environment:
      BDM__SERVER__MODE: hosted
      BDM__SERVER__PUBLIC_BIND: 0.0.0.0:8787    # reached only by Caddy on the compose network
      BDM__SERVER__ADMIN_BIND: 0.0.0.0:8788     # published to the host's loopback only (below)
      BDM__SERVER__DATA_DIR: /data
    volumes:
      - bdm-data:/data
      - bdm-config:/config
    ports:
      - "127.0.0.1:8788:8788"                   # dashboard + admin API: ssh -L 8788:127.0.0.1:8788 you@vps
    expose:
      - "8787"

  caddy:
    image: caddy:2
    container_name: bdm-caddy
    restart: unless-stopped
    depends_on:
      - blockchain-data-mcp
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  bdm-data:
  bdm-config:
  caddy-data:
  caddy-config:
