# Called by release.yml (dist post-announce-jobs): runs after the GitHub Release, the ghcr
# image and the Homebrew formula are all live. Fills version + mcpb sha256 into server.json
# and publishes it to the official MCP Registry (namespace io.github.madlabs-tech/*, GitHub OIDC).
name: publish-registry

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  registry:
    runs-on: ubuntu-22.04
    # Same rule as dist's publish jobs: the registry has no notion of prereleases.
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    permissions:
      contents: read
      id-token: write
    env:
      PLAN: ${{ inputs.plan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fill server.json
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(jq -er '.announcement_tag' <<<"$PLAN")
          VERSION=$(jq -er '.releases[0].app_version' <<<"$PLAN")
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern onchain-data-mcp.mcpb --dir "$RUNNER_TEMP"
          SHA=$(sha256sum "$RUNNER_TEMP/onchain-data-mcp.mcpb" | cut -d' ' -f1)
          jq --arg v "$VERSION" --arg tag "$TAG" --arg sha "$SHA" --arg repo "$GITHUB_REPOSITORY" '
            .version = $v
            | .packages |= map(
                if .registryType == "oci" then .identifier = "ghcr.io/madlabs-tech/onchain-data-mcp:\($v)"
                elif .registryType == "mcpb" then
                  .identifier = "https://github.com/\($repo)/releases/download/\($tag)/onchain-data-mcp.mcpb"
                  | .fileSha256 = $sha
                else . end)
          ' server.json > "$RUNNER_TEMP/server.json"
          mv "$RUNNER_TEMP/server.json" server.json
          cat server.json
      - name: Install mcp-publisher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version || true
      - name: Publish to MCP Registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
