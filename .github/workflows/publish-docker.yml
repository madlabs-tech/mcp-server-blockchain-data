# Called by release.yml (dist publish-jobs) after the GitHub Release exists.
# Pushes ghcr.io/madlabs-tech/onchain-data-mcp:<version>, :<major>.<minor> and :latest.
name: publish-docker

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/madlabs-tech/onchain-data-mcp
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          # GitHub runners have 16 GB RAM; the Dockerfile default (2) is for laptops.
          build-args: CARGO_BUILD_JOBS=4
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
