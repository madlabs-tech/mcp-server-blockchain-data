name: ci
on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this (cargo-dist local-artifacts-jobs): a tag is only released if CI passes on it.
  workflow_call:
    inputs:
      plan:
        required: false
        type: string

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-features

  # Every vendor adapter must build on its own (features are independent).
  adapter-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.90
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack check -p bdm-adapters --each-feature --no-dev-deps

  # The image is otherwise only built at release time (publish-docker.yml); build it on every PR
  # so Dockerfile / .dockerignore breakage shows up before a tag. Same platform, build-arg and gha
  # cache as the release job, so the two share cached layers.
  docker:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          build-args: CARGO_BUILD_JOBS=4
          tags: onchain-data-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          out="$(docker run --rm onchain-data-mcp:ci --version)"
          echo "$out"
          case "$out" in onchain-data-mcp*) ;; *) echo "unexpected --version output" >&2; exit 1 ;; esac
