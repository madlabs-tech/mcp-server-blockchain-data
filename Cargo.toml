[package]
name = "evm-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Ethereum/EVM interaction - Using Alloy
alloy = "1.0.41"

# Error handling
anyhow = "1.0.100"

# MCP SDK - Official Rust SDK
rmcp = "0.8.3"

# Serialization
serde = "1.0.228"
serde_json = "1.0.145"

# Async runtime
tokio = "1.48.0"

# Logging
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
