[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/madlabs-tech/onchain-data-mcp"
homepage = "https://github.com/madlabs-tech/onchain-data-mcp"

[workspace.dependencies]
# internal
bdm-domain = { path = "crates/domain" }
bdm-ports = { path = "crates/ports" }
bdm-config = { path = "crates/config" }
bdm-routing = { path = "crates/routing" }
bdm-protocols = { path = "crates/protocols" }
bdm-app = { path = "crates/app" }
bdm-adapters = { path = "crates/adapters" }
bdm-transport-mcp = { path = "crates/transport-mcp" }
bdm-transport-http = { path = "crates/transport-http" }
bdm-store = { path = "crates/store" }
bdm-testkit = { path = "crates/testkit" }

# chain
alloy-primitives = { version = "1.4", features = ["serde"] }
alloy-sol-types = "1.4"
bs58 = "0.5"

# mcp / http
rmcp = { version = "0.8.3", features = ["server", "transport-io"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace", "timeout", "catch-panic"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
http = "1"
url = "2"

# runtime / core
tokio = { version = "1.48", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
thiserror = "2"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.43", features = ["serde-with-str"] }
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.9"
arc-swap = "1.7"
moka = { version = "0.12", features = ["future"] }
governor = "0.10"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.9"

# test
wiremock = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Quick local builds; releases use [profile.dist].
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
strip = true

# Reliability rule: no panics on untrusted data in production code. Test code opts out with
# `#![cfg_attr(test, allow(..))]` / `#![allow(..)]` headers. `serde_json::Value["k"]` reads are
# panic-free and carry a scoped, justified allow where clippy flags them.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
unreachable = "deny"

# The profile that `dist` builds release artifacts with
[profile.dist]
inherits = "release"
lto = "thin"
