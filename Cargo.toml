[package]
name = "evm-mcp-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Ethereum/EVM interaction - Using Alloy
alloy = { version = "1.0.41", features = ["full"] }

# Error handling
anyhow = "1.0.100"

# MCP SDK - Official Rust SDK
rmcp = { version = "0.8.3", features = ["server", "transport-io"] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
schemars = "0.8"

# Async runtime
tokio = { version = "1.48.0", features = ["full"] }

# Logging
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Utilities
hex = "0.4"
once_cell = "1.20"
chrono = "0.4"
